# Runs the Anston Android app on a virtual phone and takes screenshots
# (sized for the Google Play listing: 1080x1920). Also a quick check that the
# app opens and loads myanston.com.
# Run it from GitHub → Actions → "Android screenshots" → Run workflow, then
# download "anston-screenshots" from the run.
name: Android screenshots

on:
  workflow_dispatch:
  pull_request:
    paths: [".github/workflows/android-screenshots.yml"]

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build the app
        working-directory: mobile
        run: |
          npm ci
          npx cap sync android
          cd android && ./gradlew assembleDebug --no-daemon

      - name: Enable KVM (faster emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on a virtual phone and take screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash mobile/scripts/screenshots.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anston-screenshots
          path: shots/
